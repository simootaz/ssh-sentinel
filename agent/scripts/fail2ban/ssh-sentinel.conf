# fail2ban filter for ssh-sentinel decisions.
#
# Matches the agent's "decision=deny" lines that carry a source IP, so a jail can ban an
# address locally after a few denials on this server. This is the per-server layer; the
# backend's auto-block is the fleet-wide one. The two do not talk to each other.
#
# Must match:
#   Sep 14 20:12:07 web-01 ssh-sentinel[2131]: decision=deny context=ssh user=deploy rhost=203.0.113.42 host=web-01 reason=admin request=5f1c9b2e-2c3a-4f6a-9b1e-0d3a2b7c4e11
#   Sep 14 20:12:40 web-01 ssh-sentinel[2140]: decision=deny context=ssh user=root rhost=198.51.100.7 host=web-01 reason=timeout request=9a7d3e10-6b2f-4c55-8e0a-1f2b3c4d5e6f
# Must not match (no source IP, or an allow):
#   Sep 14 20:13:01 web-01 ssh-sentinel[2150]: decision=deny context=sudo user=deploy rhost=- host=web-01 reason=unreachable request=-
#   Sep 14 20:13:20 web-01 ssh-sentinel[2160]: decision=allow context=ssh user=deploy rhost=203.0.113.42 host=web-01 reason=admin request=5f1c9b2e-2c3a-4f6a-9b1e-0d3a2b7c4e11
#
# Test the filter:
#   fail2ban-regex systemd-journal /etc/fail2ban/filter.d/ssh-sentinel.conf
#   fail2ban-regex /var/log/auth.log /etc/fail2ban/filter.d/ssh-sentinel.conf   (or /var/log/secure)

[INCLUDES]
before = common.conf

[Definition]
_daemon = ssh-sentinel

failregex = ^%(__prefix_line)sdecision=deny context=\S+ user=\S+ rhost=<HOST> host=\S+ reason=\S+ request=\S+$

ignoreregex =

journalmatch = SYSLOG_IDENTIFIER=ssh-sentinel
